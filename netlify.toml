[build]
command = "mkdocs build"
publish = "site"

[[headers]]
  for = "assets/swoosh/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "assets/swoosh-black/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "search/search_index.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
