site_name: System Monitor
site_url: https://systemmonitor.motionapplied.com/
repo_url: https://github.com/motionapplied/SystemMonitor.Site
edit_uri: edit/main/docs/
docs_dir: 'docs'
site_description: 'Documentation for Motion Applied System Monitor: ECU configuration, calibration, tuning, data logging and the System Monitor developer APIs.'

theme:
  name: material
  palette:
    scheme: default
    primary: custom
    accent: custom
  logo: assets/swoosh/motion_applied_logo_white.svg
  favicon: assets/swoosh/motion_applied_logo.svg
  features:
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

copyright: >
  Copyright &copy; 2026 Motion Applied Ltd. -
  <a href="#__consent">Change cookie settings</a>

